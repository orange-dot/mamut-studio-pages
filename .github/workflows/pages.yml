name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Install Dioxus CLI
        run: |
          if command -v dx >/dev/null 2>&1 && dx --version | grep -q "0.7.6"; then
            dx --version
          else
            cargo install dioxus-cli --version 0.7.6 --locked --force
          fi

      - name: Build
        run: MAMUT_PUBLIC_BASE_PATH=/mamut-studio-pages dx build --release --platform web --debug-symbols false --base-path /mamut-studio-pages

      - name: Remove custom domain marker
        run: rm -f target/dx/mamut-sint-hw/release/web/public/CNAME

      - name: Add SPA fallback
        run: cp target/dx/mamut-sint-hw/release/web/public/index.html target/dx/mamut-sint-hw/release/web/public/404.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: target/dx/mamut-sint-hw/release/web/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
